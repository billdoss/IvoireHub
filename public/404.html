<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharmacies de garde - IvoireHub</title>
  <script type="text/javascript">
    // Redirige vers index.html en préservant le chemin original
    // pour que React Router puisse afficher la bonne page (SPA sur GitHub Pages)

    sessionStorage.setItem("spa-redirect-path", path);
    var base = "/IvoireHub/";
    window.location.replace(base + "index.html");
  </script>
</head>
